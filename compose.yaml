services:
  blender-mcp:
    build: .
    image: blender-render-mcp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TAILSCALE_AUTH_KEY
      - TAILSCALE_SSH
      - MCP_PORT=8080
      - BLENDER_EXECUTABLE=/home/headless/blender/blender
    volumes:
      - tailscale-state:/home/headless/.local/share/tailscale

volumes:
  tailscale-state:
